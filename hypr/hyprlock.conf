general {
    disable_loading_bar = false
    grace = 2
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = /home/iseeasta/Pictures/wallpapers/locked.jpg
    blur_passes = 0
    noise = 0.0117
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.15
}

# Left panel — frosted glass box
shape {
    monitor =
    size = 380, 560
    color = rgba(30, 30, 46, 0.55)
    rounding = 24
    border_size = 2
    border_color = rgba(180, 190, 254, 0.5)
    position = 80, 0
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 56
    font_family = JetBrainsMono Nerd Font
    position = 100, 220
    halign = left
    valign = center
}

# Day + date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(166, 173, 200, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 100, 175
    halign = left
    valign = center
}

# Profile picture
image {
    monitor =
    path = /home/iseeasta/Pictures/Pfp/Asta1.jpg
    size = 90
    rounding = -1
    border_size = 3
    border_color = rgba(180, 190, 254, 0.8)
    position = 100, 90
    halign = left
    valign = center
}

# Username
label {
    monitor =
    text =  $USER
    color = rgba(205, 214, 244, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 100, 20
    halign = left
    valign = center
}

# Password field
input-field {
    monitor =
    size = 260, 55
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.35
    dots_color = rgba(180, 190, 254, 1.0)
    outer_color = rgba(180, 190, 254, 0.8) rgba(203, 166, 247, 0.8) 45deg
    inner_color = rgba(30, 30, 46, 0.9)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Welcome back, Asta</i>
    hide_input = false
    check_color = rgba(166, 227, 161, 0.9)
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <i>Wrong password</i>
    fail_transition = 300
    position = 100, -60
    halign = left
    valign = center
}

# Battery percentage
label {
    monitor =
    text = cmd[update:5000] echo "  $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || cat /sys/class/power_supply/BAT1/capacity 2>/dev/null)%"
    color = rgba(166, 173, 200, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 100, -140
    halign = left
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = cmd[update:1000] hyprctl devices -j | jq -r '.keyboards[0].active_keymap'
    color = rgba(166, 173, 200, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 100, -170
    halign = left
    valign = center
}